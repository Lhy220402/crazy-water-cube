      <meta name="description" content="疯狂水立方：水主题 2048 合成小游戏。军 → 赢² → 水³ → Lec → OLD FIVE，真通关了吗？手机浏览器直接玩。" />
    <meta property="og:title" content="疯狂水立方 · 真通关了吗？" />
    <meta property="og:description" content="滑动合成，合出 OLD FIVE 只是假通关——真正的结局藏在词条之间。" />
    <meta property="og:type" content="website" />
</head>
  <body>
    <main class="app" id="app">
      <div class="scene" aria-hidden="true">
        <span class="scene__glow"></span>
        <span class="scene__caustic"></span>
        <span class="scene__bubble scene__bubble--a"></span>
        <span class="scene__bubble scene__bubble--b"></span>
        <span class="scene__bubble scene__bubble--c"></span>
        <span class="scene__bubble scene__bubble--d"></span>
        <span class="scene__bubble scene__bubble--e"></span>
        <span class="scene__wave scene__wave--a"></span>
        <span class="scene__wave scene__wave--b"></span>
      </div>

      <section
        class="intro"
        id="intro"
        role="dialog"
        aria-modal="true"
        aria-labelledby="intro-title"
      >
        <div class="intro__card">
          <div class="intro__mark" aria-hidden="true">💧</div>
          <p class="intro__eyebrow">水主题 2048</p>
          <h1 class="intro__title" id="intro-title">疯狂水立方</h1>
          <p class="intro__chain">军 → 赢² → 水³ → Lec → OLD FIVE</p>
          <p class="intro__hook">合出 OLD FIVE 只是假通关——真正的结局，藏在词条之间。</p>
          <div class="intro__stats">
            <div class="intro__stat">
              <span>最高分</span>
              <strong id="intro-best">0</strong>
            </div>
            <div class="intro__stat">
              <span>已收录</span>
              <strong id="intro-codex">0 条</strong>
            </div>
          </div>
          <div class="intro__actions">
            <button class="pill pill--primary" id="intro-start" type="button">开始合成</button>
            <button class="pill pill--ghost" id="intro-guide" type="button">玩法说明</button>
            <button class="pill pill--ghost" id="intro-save" type="button">存档导入 / 导出</button>
          </div>
          <p class="intro__hint">滑动棋盘，或按方向键 / WASD · 单文件离线可玩</p>
        </div>
      </section>

      <div class="shell">
        <header class="head">
          <div class="brand">
            <div class="brand__mark" aria-hidden="true">💧</div>
            <div class="brand__meta">
              <h1 class="brand__title">疯狂水立方</h1>
              <p class="brand__sub" id="chain-caption">军 → 赢² → 水³ → Lec → OLD FIVE</p>
            </div>
          </div>
          <div class="scores">
            <div class="score" id="score-box">
              <span class="score__k">得分</span>
              <strong class="score__v" id="score">0</strong>
            </div>
            <div class="score score--best" id="best-box">
              <span class="score__k">最高</span>
              <strong class="score__v" id="best">0</strong>
            </div>
          </div>
        </header>

        <section class="stage">
          <div class="buffs" id="buffs" hidden aria-label="当前增益"></div>
          <div
            class="board"
            id="board"
            role="application"
            aria-label="疯狂水立方棋盘：上下左右滑动，或用键盘方向键移动方块"
          >
            <div class="board__grid" id="grid" aria-hidden="true"></div>
            <div class="board__tiles" id="tiles"></div>
            <div class="board__fx" id="fx" aria-hidden="true"></div>
          </div>
          <p class="hint" id="hint">滑动或按方向键 · 同级相碰合成 · 词条之间藏着特殊组合</p>
          <!-- 开发者模式：默认隐藏，导入框输入魔法码解锁后才出现；开关状态持久化 -->
          <div class="devbar" id="dev-bar" hidden aria-label="开发者模式">
            <span class="devbar__tag">🛠 开发者模式</span>
            <button
              class="devbar__switch"
              id="dev-toggle"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="开发者模式开关"
