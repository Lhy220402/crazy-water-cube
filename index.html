  </head>
  <body>
    <main class="app" id="app">
      <div class="scene" aria-hidden="true">
        <span class="scene__glow"></span>
        <span class="scene__caustic"></span>
        <span class="scene__bubble scene__bubble--a"></span>
        <span class="scene__bubble scene__bubble--b"></span>
        <span class="scene__bubble scene__bubble--c"></span>
        <span class="scene__bubble scene__bubble--d"></span>
        <span class="scene__bubble scene__bubble--e"></span>
        <span class="scene__wave scene__wave--a"></span>
        <span class="scene__wave scene__wave--b"></span>
      </div>

      <section
        class="intro"
        id="intro"
        role="dialog"
        aria-modal="true"
        aria-labelledby="intro-title"
      >
        <div class="intro__card">
          <div class="intro__mark" aria-hidden="true">💧</div>
          <p class="intro__eyebrow">水主题 2048</p>
          <h1 class="intro__title" id="intro-title">疯狂水立方</h1>
          <p class="intro__chain">军 → 赢² → 水³ → Lec → OLD FIVE</p>
          <p class="intro__hook">合出 OLD FIVE 只是假通关——真正的结局，藏在词条之间。</p>
          <div class="intro__stats">
            <div class="intro__stat">
              <span>最高分</span>
              <strong id="intro-best">0</strong>
            </div>
            <div class="intro__stat">
              <span>已收录</span>
              <strong id="intro-codex">0 条</strong>
            </div>
          </div>
          <div class="intro__actions">
            <button class="pill pill--primary" id="intro-start" type="button">开始合成</button>
            <button class="pill pill--ghost" id="intro-guide" type="button">玩法说明</button>
            <button class="pill pill--ghost" id="intro-save" type="button">存档导入 / 导出</button>
          </div>
          <p class="intro__hint">滑动棋盘，或按方向键 / WASD · 单文件离线可玩</p>
        </div>
      </section>

      <div class="shell">
        <header class="head">
          <div class="brand">
            <div class="brand__mark" aria-hidden="true">💧</div>
            <div class="brand__meta">
              <h1 class="brand__title">疯狂水立方</h1>
              <p class="brand__sub" id="chain-caption">军 → 赢² → 水³ → Lec → OLD FIVE</p>
            </div>
          </div>
          <div class="scores">
            <div class="score" id="score-box">
              <span class="score__k">得分</span>
              <strong class="score__v" id="score">0</strong>
            </div>
            <div class="score score--best" id="best-box">
              <span class="score__k">最高</span>
              <strong class="score__v" id="best">0</strong>
            </div>
          </div>
        </header>

        <section class="stage">
          <div class="buffs" id="buffs" hidden aria-label="当前增益"></div>
          <div
            class="board"
            id="board"
            role="application"
            aria-label="疯狂水立方棋盘：上下左右滑动，或用键盘方向键移动方块"
          >
            <div class="board__grid" id="grid" aria-hidden="true"></div>
            <div class="board__tiles" id="tiles"></div>
            <div class="board__fx" id="fx" aria-hidden="true"></div>
          </div>
          <p class="hint" id="hint">滑动或按方向键 · 同级相碰合成 · 词条之间藏着特殊组合</p>
          <!-- 开发者模式：默认隐藏，导入框输入魔法码解锁后才出现；开关状态持久化 -->
          <div class="devbar" id="dev-bar" hidden aria-label="开发者模式">
            <span class="devbar__tag">🛠 开发者模式</span>
            <button
              class="devbar__switch"
              id="dev-toggle"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="开发者模式开关"
            >关</button>
            <button class="pill pill--ghost devbar__open" id="dev-open" type="button" hidden disabled>
              开发者工具
            </button>
          </div>
        </section>

        <footer class="bar">
          <div class="bar__main">
            <button class="pill pill--primary" id="btn-new" type="button">新游戏</button>
            <button class="pill" id="btn-undo" type="button" disabled>撤销</button>
            <button class="pill pill--ghost" id="btn-guide" type="button">图鉴</button>
          </div>
          <div class="bar__tools" aria-label="偏好设置">
            <button class="pill pill--icon" id="btn-sound" type="button" aria-label="音效：开，点击关闭" aria-pressed="true" title="音效：开（点击关闭）">🔊</button>
            <button class="pill pill--icon" id="btn-theme" type="button" aria-label="外观：跟随系统，点击切换">◐</button>
          </div>
        </footer>
      </div>

      <p class="sr-only" id="live" role="status" aria-live="polite"></p>

      <div class="overlay" id="overlay" hidden aria-hidden="true">
        <div class="overlay__scrim" id="overlay-scrim"></div>
        <div class="panel panel--overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
          <p class="panel__eyebrow" id="overlay-eyebrow"></p>
          <h2 class="panel__title" id="overlay-title"></h2>
          <p class="panel__text" id="overlay-text"></p>
          <div class="panel__extra" id="overlay-extra" hidden></div>
          <div class="panel__stats" id="overlay-stats"></div>
          <div class="panel__actions" id="overlay-actions"></div>
        </div>
        <div class="burst" id="burst" aria-hidden="true"></div>
      </div>

      <div class="sheet" id="sheet" hidden aria-hidden="true">
        <div class="sheet__scrim" id="sheet-scrim"></div>
        <div class="panel panel--sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="sheet__grip" aria-hidden="true"></div>
          <div class="sheet__head">
            <h2 class="panel__title panel__title--sm" id="sheet-title">图鉴</h2>
            <button class="sheet__close" id="sheet-close" type="button" aria-label="关闭">✕</button>
          </div>
          <div class="tabs" role="tablist" aria-label="图鉴分类">
            <button
              class="tab is-active"
              id="tab-chain"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="pane-chain"
            >
              合成链
            </button>
            <button
              class="tab"
              id="tab-codex"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="pane-codex"
            >
              词条 <span class="tab__count" id="tab-codex-count"></span>
            </button>
          </div>
          <p class="panel__text" id="sheet-sub"></p>
          <div class="pane" id="pane-chain">
            <div class="chain" id="chain"></div>
          </div>
          <div class="pane" id="pane-codex" hidden>
            <div class="codex" id="codex"></div>
          </div>
          <div class="sheet__foot">
            <button class="pill pill--primary pill--wide" id="sheet-done" type="button">开始合成</button>
            <!-- 「关于」是低频功能：放进图鉴底部，远离主操作区，避免误触 -->
            <button class="sheet__about" id="btn-about" type="button">关于本作 · 版本与仓库</button>
          </div>
        </div>
      </div>
    </main>

    <!-- INLINE_SCRIPT -->
  </body>
</html>
